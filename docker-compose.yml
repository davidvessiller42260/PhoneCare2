services:
  phonecare:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PHONECARE_ADMIN_TOKEN: ${PHONECARE_ADMIN_TOKEN:?Set PHONECARE_ADMIN_TOKEN in .env}
      PHONECARE_SESSION_SECRET: ${PHONECARE_SESSION_SECRET:?Set PHONECARE_SESSION_SECRET in .env}
      PHONECARE_DB: /data/phonecare.db
      PHONECARE_COOKIE_SECURE: "true"
    volumes:
      - phonecare_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  phonecare_data:
